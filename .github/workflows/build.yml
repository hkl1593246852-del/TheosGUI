name: Build & Package IPA

on:
  push:
    branches: [master, main]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-15  # Xcode 16+
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create placeholder AppIcon
        run: |
          mkdir -p TheosGUI/Assets.xcassets/AppIcon.appiconset

          # 用 Python 生成指定尺寸的蓝色占位 PNG
          python3 << 'PYEOF'
          import struct, zlib, os

          def make_png(path, w, h):
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              raw = b''
              for y in range(h):
                  raw += b'\x00'
                  for x in range(w):
                      raw += b'\x40\x80\xff'
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              with open(path, 'wb') as f:
                  f.write(header + ihdr + idat + iend)

          base = 'TheosGUI/Assets.xcassets/AppIcon.appiconset'
          # Generate each needed pixel size
          sizes = {
              'icon20x20.png':   (20, 20),
              'icon29x29.png':   (29, 29),
              'icon40x40.png':   (40, 40),
              'icon58x58.png':   (58, 58),
              'icon60x60.png':   (60, 60),
              'icon76x76.png':   (76, 76),
              'icon80x80.png':   (80, 80),
              'icon87x87.png':   (87, 87),
              'icon120x120.png': (120, 120),
              'icon152x152.png': (152, 152),
              'icon167x167.png': (167, 167),
              'icon180x180.png': (180, 180),
          }
          for fname, (w, h) in sizes.items():
              make_png(os.path.join(base, fname), w, h)
              print(f'  Created {fname} ({w}x{h})')
          PYEOF

          cat > TheosGUI/Assets.xcassets/Contents.json << 'JSONEOF'
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

          cat > TheosGUI/Assets.xcassets/AppIcon.appiconset/Contents.json << 'JSONEOF'
          {
            "images" : [
              {"size" : "20x20", "idiom" : "iphone", "filename" : "icon40x40.png",  "scale" : "2x"},
              {"size" : "20x20", "idiom" : "iphone", "filename" : "icon60x60.png",  "scale" : "3x"},
              {"size" : "29x29", "idiom" : "iphone", "filename" : "icon29x29.png",  "scale" : "1x"},
              {"size" : "29x29", "idiom" : "iphone", "filename" : "icon58x58.png",  "scale" : "2x"},
              {"size" : "29x29", "idiom" : "iphone", "filename" : "icon87x87.png",  "scale" : "3x"},
              {"size" : "40x40", "idiom" : "iphone", "filename" : "icon80x80.png",  "scale" : "2x"},
              {"size" : "40x40", "idiom" : "iphone", "filename" : "icon120x120.png","scale" : "3x"},
              {"size" : "60x60", "idiom" : "iphone", "filename" : "icon120x120.png","scale" : "2x"},
              {"size" : "60x60", "idiom" : "iphone", "filename" : "icon180x180.png","scale" : "3x"},
              {"size" : "20x20", "idiom" : "ipad",   "filename" : "icon20x20.png",  "scale" : "1x"},
              {"size" : "20x20", "idiom" : "ipad",   "filename" : "icon40x40.png",  "scale" : "2x"},
              {"size" : "29x29", "idiom" : "ipad",   "filename" : "icon29x29.png",  "scale" : "1x"},
              {"size" : "29x29", "idiom" : "ipad",   "filename" : "icon58x58.png",  "scale" : "2x"},
              {"size" : "40x40", "idiom" : "ipad",   "filename" : "icon40x40.png",  "scale" : "1x"},
              {"size" : "40x40", "idiom" : "ipad",   "filename" : "icon80x80.png",  "scale" : "2x"},
              {"size" : "76x76", "idiom" : "ipad",   "filename" : "icon76x76.png",  "scale" : "1x"},
              {"size" : "76x76", "idiom" : "ipad",   "filename" : "icon152x152.png","scale" : "2x"},
              {"size" : "83.5x83.5", "idiom" : "ipad","filename" : "icon167x167.png","scale" : "2x"}
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSONEOF

      - name: Generate Xcode Project
        run: |
          cd $GITHUB_WORKSPACE
          xcodegen generate --spec project.yml

      - name: Build IPA (No Sign)
        run: |
          set -o pipefail
          xcodebuild \
            -project TheosGUI.xcodeproj \
            -scheme TheosGUI \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath ./DerivedData \
            build 2>&1 | tail -100

      - name: Package IPA
        run: |
          APP_DIR=$(find ./DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "Found: $APP_DIR"

          # 创建 Payload 结构
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/

          # 伪签名 (ldid for jailbreak)
          if command -v ldid &> /dev/null; then
            ldid -S Payload/*.app/TheosGUI
          fi

          # 打包
          zip -r TheosGUI.ipa Payload
          ls -la TheosGUI.ipa
          echo "IPA_SIZE=$(stat -f%z TheosGUI.ipa)" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheosGUI.ipa
          path: TheosGUI.ipa
          retention-days: 90

      - name: Upload App Bundle (for sideload)
        uses: actions/upload-artifact@v4
        with:
          name: TheosGUI.app
          path: ${{ github.workspace }}/DerivedData/Build/Products/Release-iphoneos/TheosGUI.app
          retention-days: 90
