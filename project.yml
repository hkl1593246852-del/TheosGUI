name: TheosGUI
options:
  bundleIdPrefix: com.iosbx
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  TheosGUI:
    type: application
    platform: iOS
    sources:
      - path: TheosGUI
    settings:
      base:
        INFOPLIST_FILE: TheosGUI/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.iosbx.theosgui
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
    preBuildScripts:
      - name: "Skip Code Sign"
        script: |
          # 越狱编译：不需要签名
          mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
        basedOnDependencyAnalysis: false
